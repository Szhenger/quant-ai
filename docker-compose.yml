services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantai
      POSTGRES_PASSWORD: quantai
      POSTGRES_DB: quantai
    ports:
      - "5432:5432"
    volumes:
      - quantai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantai -d quantai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./runtime
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./runtime:/app
    ports:
      - "8000:8000"
    environment: &backend_env
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure-key-change-in-production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      MARKETDATA_PROVIDER: ${MARKETDATA_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      # /healthz verifies the DB and the shared cache from inside the app.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./runtime
    command: celery -A config worker --loglevel=info
    volumes:
      - ./runtime:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./runtime
    command: celery -A config beat --loglevel=info
    volumes:
      - ./runtime:/app
    environment: *backend_env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  quantai_pg:
