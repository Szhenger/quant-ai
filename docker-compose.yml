services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantai
      POSTGRES_PASSWORD: quantai
      POSTGRES_DB: quantai
    ports:
      - "5432:5432"
    volumes:
      - quantai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantai -d quantai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment: &backend_env
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure-key-change-in-production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      MARKETDATA_PROVIDER: ${MARKETDATA_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      - api
      - redis

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      - worker

volumes:
  quantai_pg:
