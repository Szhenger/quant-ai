services:
  # ── API (Django ASGI: HTTP + WebSockets via Daphne) ──────────────────────────
  - type: web
    name: quantai-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MARKETDATA_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Strategy evaluation worker (Celery) ──────────────────────────────────────
  - type: worker
    name: quantai-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: MARKETDATA_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Beat scheduler (enqueues due strategies every minute) ────────────────────
  - type: worker
    name: quantai-beat
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Redis (Celery broker + Channels layer) ───────────────────────────────────
  - type: redis
    name: quantai-redis
    plan: starter
    maxmemoryPolicy: noeviction

  # ── Frontend (static SPA) ────────────────────────────────────────────────────
  - type: web
    name: quantai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist

databases:
  - name: quantai-db
    plan: starter
