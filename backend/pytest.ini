[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = -p no:cacheprovider --strict-markers
# The suite lives at the repo root in test/backend; `backend/test` is a
# symlink to it locally, and the compose test service bind-mounts it to
# /app/test. Either way, collection starts here.
testpaths = test
# Focus-area markers (applied automatically by directory — or by file under
# test/backend/system/ — in test/backend/conftest.py); qtest selects with `-m`.
markers =
    rest: REST components — routes, auth, contracts, pagination, throttling
    react: frontend logic mirrored by the vitest suite
    celery_redis: Celery task semantics, beat schedule, channel-layer delivery
    postgres: storage behavior — constraints, JSONB, locking, migrations
    indicators: quantitative indicator math
    journeys: end-to-end user journeys through the API
