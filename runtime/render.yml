services:
  # ── API (Django ASGI: HTTP + WebSockets via Daphne) ──────────────────────────
  - type: web
    name: quantai-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    # Deploys only go live once the DB and cache answer from inside the app.
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The frontend is a separate static-site origin; without this the browser
      # blocks every API call from it.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://quantai-frontend.onrender.com"
      - key: MARKETDATA_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Strategy evaluation worker (Celery) ──────────────────────────────────────
  - type: worker
    name: quantai-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      # The worker sends the email channel: with DEBUG unset it would fall back
      # to the console email backend and silently discard every message.
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: MARKETDATA_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      # SMTP for the email alert channel (set in the dashboard).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Beat scheduler (enqueues due strategies every minute) ────────────────────
  - type: worker
    name: quantai-beat
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantai-redis
          property: connectionString
      - key: DB_HOST
        fromDatabase: { name: quantai-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quantai-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quantai-db, property: database }
      - key: DB_USER
        fromDatabase: { name: quantai-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quantai-db, property: password }

  # ── Redis (Celery broker + Channels layer) ───────────────────────────────────
  - type: redis
    name: quantai-redis
    plan: starter
    maxmemoryPolicy: noeviction

  # ── Frontend (static SPA) ────────────────────────────────────────────────────
  # A static site is its own origin, so the app must be pointed at the API
  # service explicitly — relative /api and same-origin WebSockets only work in
  # dev behind the Vite proxy. These are baked in at build time.
  - type: web
    name: quantai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: "https://quantai-api.onrender.com/api/v1"
      - key: VITE_WS_BASE
        value: "wss://quantai-api.onrender.com"

databases:
  - name: quantai-db
    plan: starter
