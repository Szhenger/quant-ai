services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantai
      POSTGRES_PASSWORD: quantai
      POSTGRES_DB: quantai
    ports:
      # Loopback only: the dev credentials are public, so the port must not be
      # reachable from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - quantai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantai -d quantai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only: Redis is password-less and carries the Celery broker,
      # channel layer and eval locks.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment: &backend_env
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure-key-change-in-production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      MARKETDATA_PROVIDER: ${MARKETDATA_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      # /healthz verifies the DB and the shared cache from inside the app.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    # restart matters most here: a crashed worker otherwise stays exited and
    # sweeps/evaluations stop silently while the api healthcheck stays green.
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - ../backend:/app
    environment: *backend_env
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../backend
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ../backend:/app
    environment: *backend_env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  quantai_pg:
