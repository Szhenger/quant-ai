name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes any in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tests run against PostgreSQL (prod parity) with eager Celery +
      # in-memory channels; compose starts the throwaway test-db dependency.
      - name: Run backend test suite
        run: docker compose -f docker-compose.test.yml run --rm --build test

      # Reuses the image built above: catches models that drifted from the
      # committed migrations, and any failing Django system check.
      - name: Migration drift + system checks
        run: >
          docker compose -f docker-compose.test.yml run --rm test
          sh -c "python manage.py makemigrations --check --dry-run && python manage.py check"

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      # "build" runs tsc first, so this is the type-check and the prod build.
      # tsc's include covers ../test/frontend, so the vitest files are
      # type-checked here too.
      - name: Type-check and build
        working-directory: console
        run: npm run build

      # The vitest suite (test/frontend): pure-logic + contract-pin tests.
      - name: Frontend unit tests (vitest)
        working-directory: console
        run: npm test
